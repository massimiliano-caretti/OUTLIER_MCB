<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 502" width="960" height="502" role="img" aria-labelledby="t d"><title id="t">The method in six steps</title><desc id="d">1 name the box, 2 break an assumption, 3 diverge, 4 converge, 5 falsify, 6 claim only what survived.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs><rect x="2" y="20" width="290" height="196" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><rect x="2" y="20" width="6" height="196" rx="3" fill="#2a78d6"/><circle cx="40" cy="60" r="17" fill="#2a78d6"/><text x="40" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="40" dy="0.0">1</tspan></text><text x="68" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="68" dy="0.0">Name the box</tspan></text><text x="26" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="26" dy="0.0">The model states its own</tspan><tspan x="26" dy="22.4">default answers. They become</tspan><tspan x="26" dy="22.4">the box every idea must</tspan><tspan x="26" dy="22.4">leave.</tspan></text><path d="M300 118.0 h25" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/><rect x="335" y="20" width="290" height="196" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><rect x="335" y="20" width="6" height="196" rx="3" fill="#2a78d6"/><circle cx="373" cy="60" r="17" fill="#2a78d6"/><text x="373" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="373" dy="0.0">2</tspan></text><text x="401" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="401" dy="0.0">Break an assumption</tspan></text><text x="359" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="359" dy="0.0">Find a hidden assumption the</tspan><tspan x="359" dy="22.4">standard solutions share and</tspan><tspan x="359" dy="22.4">name the axis it sits on.</tspan></text><path d="M633 118.0 h25" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/><rect x="668" y="20" width="290" height="196" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><rect x="668" y="20" width="6" height="196" rx="3" fill="#2a78d6"/><circle cx="706" cy="60" r="17" fill="#2a78d6"/><text x="706" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="706" dy="0.0">3</tspan></text><text x="734" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="734" dy="0.0">Diverge</tspan></text><text x="692" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="692" dy="0.0">Independent calls, distant</tspan><tspan x="692" dy="22.4">points of view, the model's</tspan><tspan x="692" dy="22.4">full distribution: short</tspan><tspan x="692" dy="22.4">intents, not solutions.</tspan></text><rect x="2" y="286" width="290" height="196" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><rect x="2" y="286" width="6" height="196" rx="3" fill="#2a78d6"/><circle cx="40" cy="326" r="17" fill="#2a78d6"/><text x="40" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="40" dy="0.0">4</tspan></text><text x="68" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="68" dy="0.0">Converge</tspan></text><text x="26" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="26" dy="0.0">Develop each intent at low</tspan><tspan x="26" dy="22.4">temperature. If it drifts</tspan><tspan x="26" dy="22.4">back to a default, retry</tspan><tspan x="26" dy="22.4">once.</tspan></text><path d="M300 384.0 h25" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/><rect x="335" y="286" width="290" height="196" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><rect x="335" y="286" width="6" height="196" rx="3" fill="#eb6834"/><circle cx="373" cy="326" r="17" fill="#eb6834"/><text x="373" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="373" dy="0.0">5</tspan></text><text x="401" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="401" dy="0.0">Falsify</tspan></text><text x="359" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="359" dy="0.0">Prior-art search, a test that</tspan><tspan x="359" dy="22.4">must go RED→GREEN, or a</tspan><tspan x="359" dy="22.4">prover. External, never</tspan><tspan x="359" dy="22.4">self-judged.</tspan></text><path d="M633 384.0 h25" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/><rect x="668" y="286" width="290" height="196" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><rect x="668" y="286" width="6" height="196" rx="3" fill="#eb6834"/><circle cx="706" cy="326" r="17" fill="#eb6834"/><text x="706" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="706" dy="0.0">6</tspan></text><text x="734" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="734" dy="0.0">Honest claim</tspan></text><text x="692" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="692" dy="0.0">Only what survived is</tspan><tspan x="692" dy="22.4">claimed, capped by the</tspan><tspan x="692" dy="22.4">evidence: from INSIDE_THE_BOX</tspan><tspan x="692" dy="22.4">up to verified, useful</tspan><tspan x="692" dy="22.4">novelty.</tspan></text><path d="M813.0 222 V248 H147.0 V278" fill="none" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle"><tspan x="480" dy="0.0">the box is left behind — now the ideas must survive</tspan></text></svg>
