<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t d"><title id="t">OUTLIER_MCB</title><desc id="d">Ideas leave the box of the model's default answers; at an external test two survive and one is killed.</desc><style>.mover{offset-path:path("M640 130 C700 110 760 85 850 78 L905 78");animation:leave 6s ease-in-out infinite;}@keyframes leave{0%,15%{offset-distance:0%;opacity:0}25%{opacity:1}85%{offset-distance:100%;opacity:1}100%{offset-distance:100%;opacity:0}}@media (prefers-reduced-motion: reduce){.mover{animation:none;opacity:0}}</style><text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="0" dy="0.0">OUTLIER_MCB</tspan></text><text x="2" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="2" dy="0.0">Push a language model out of its default answers,</tspan></text><text x="2" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="2" dy="0.0">and keep only the ideas that survive a test.</tspan></text><text x="2" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="2" dy="0.0">pure Python · zero dependencies · every verdict capped by</tspan><tspan x="2" dy="23.2">evidence · local models (Ollama, llama.cpp, vLLM) and online</tspan><tspan x="2" dy="23.2">models (Claude, OpenAI, Gemini, …)</tspan></text><rect x="560" y="40" width="170" height="230" rx="18" fill="#f6f8fa" stroke="#818b98" stroke-width="2" stroke-dasharray="7 6"/><text x="645.0" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#59636e" text-anchor="middle"><tspan x="645.0" dy="0.0">the box: the model's</tspan></text><text x="645.0" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#59636e" text-anchor="middle"><tspan x="645.0" dy="0.0">own default answers</tspan></text><circle cx="600" cy="90" r="7" fill="#818b98" opacity="0.55"/><circle cx="625" cy="120" r="7" fill="#818b98" opacity="0.55"/><circle cx="590" cy="150" r="7" fill="#818b98" opacity="0.55"/><circle cx="640" cy="160" r="7" fill="#818b98" opacity="0.55"/><circle cx="615" cy="190" r="7" fill="#818b98" opacity="0.55"/><circle cx="660" cy="105" r="7" fill="#818b98" opacity="0.55"/><circle cx="650" cy="215" r="7" fill="#818b98" opacity="0.55"/><circle cx="595" cy="235" r="7" fill="#818b98" opacity="0.55"/><circle cx="685" cy="140" r="7" fill="#818b98" opacity="0.55"/><circle cx="670" cy="185" r="7" fill="#818b98" opacity="0.55"/><circle cx="700" cy="230" r="7" fill="#818b98" opacity="0.55"/><circle cx="630" cy="245" r="7" fill="#818b98" opacity="0.55"/><circle cx="700" cy="75" r="7" fill="#818b98" opacity="0.55"/><circle cx="580" cy="205" r="7" fill="#818b98" opacity="0.55"/><line x1="850" y1="40" x2="850" y2="270" stroke="#eb6834" stroke-width="4" stroke-linecap="round"/><text x="850" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eb6834" text-anchor="middle"><tspan x="850" dy="0.0">external test</tspan></text><text x="850" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle"><tspan x="850" dy="0.0">prior art · RED→GREEN · prover</tspan></text><path d="M690 120 C760 90 800 80 850 78" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="none" opacity="1"/><path d="M700 170 C770 170 800 160 850 158" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.55"/><path d="M680 220 C760 245 800 240 850 238" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="none" opacity="1"/><circle cx="905" cy="78" r="9" fill="#2a78d6"/><text x="925" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="925" dy="0.0">✓</tspan></text><circle cx="905" cy="238" r="9" fill="#2a78d6"/><text x="925" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="925" dy="0.0">✓</tspan></text><text x="878" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#59636e" text-anchor="start"><tspan x="878" dy="0.0">✗</tspan></text><circle class="mover" r="7" fill="#2a78d6"/></svg>
